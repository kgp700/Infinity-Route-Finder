<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우회길">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>우회길</title>
<style>
:root{
  --bg:#FFFFFF; --ink:#111827; --ink2:#374151; --ink3:#4B5563; --line:#E5E7EB; --soft:#F3F4F6;
  --accent:#1D4ED8; --accentSoft:#EFF6FF; --red:#DC2626; --orange:#F59E0B; --green:#16A34A;
  --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;background:#EEF1EA}

/* 상단 출발/도착 */
#top{position:absolute;left:12px;right:12px;top:calc(var(--safeT) + 10px);z-index:20;
  background:var(--bg);border-radius:16px;box-shadow:0 4px 18px rgba(17,24,39,.16);
  display:flex;align-items:center;gap:6px;padding:4px 4px 4px 14px}
#top .rows{flex:1;min-width:0;display:flex;flex-direction:column}
.place{display:flex;align-items:center;gap:10px;height:44px;border:0;background:none;padding:0;
  text-align:left;font-size:16px;min-width:0}
.place span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place.empty span.t{color:var(--ink3)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.sq{flex:none;width:10px;height:10px;border-radius:2px;background:var(--ink)}
#top .div{height:1px;background:var(--soft)}
.iconbtn{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);
  display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:var(--ink2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 지도 위 버튼 */
#fabs{position:absolute;right:12px;top:calc(var(--safeT) + 118px);z-index:15;display:flex;flex-direction:column;gap:8px}
.fab{width:48px;height:48px;border:0;border-radius:14px;background:var(--bg);box-shadow:0 2px 10px rgba(17,24,39,.18);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.fab svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab.on{background:var(--ink);color:#fff}
.fab.on svg{stroke:#fff}

#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safeT) + 118px);z-index:15;
  max-width:calc(100% - 140px);padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;
  font-size:15px;font-weight:600;display:none;align-items:center;gap:8px;pointer-events:none;text-align:center}
#hint.show{display:flex}
#hint i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--orange)}

/* 하단 시트 */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:25;background:var(--bg);
  border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(17,24,39,.14);
  padding:6px 16px calc(16px + var(--safeB));max-height:64dvh;overflow-y:auto;
  display:flex;flex-direction:column;gap:12px;transition:transform .2s}
#sheet.collapsed .body{display:none}
.grab{align-self:center;width:64px;height:24px;border:0;background:none;display:flex;align-items:center;justify-content:center;flex:none}
.grab i{width:40px;height:4px;border-radius:2px;background:#D1D5DB}
.body{display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
p.sub{margin:0;font-size:15px;line-height:1.5;color:var(--ink3)}
.pills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pill{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px dashed #D1D5DB}
.pill.active{border:2px solid var(--ink)}
.pill.filled{border:1px solid var(--line);background:#F9FAFB}
.pill small{font-size:12px;color:var(--ink3)}
.pill b{font-size:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:5px;border-radius:3px}
.info{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.info small{font-size:12px;color:var(--ink3)}
.info b{font-size:16px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{height:48px;padding:0 16px;border-radius:12px;border:1px solid #D1D5DB;background:var(--bg);font-size:15px;font-weight:600}
.btn.primary{height:56px;border:0;background:var(--accent);color:#fff;font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.btn.primary small{display:block;font-size:12px;font-weight:500;opacity:.9}
.btn.primary svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.full{width:100%}
.tols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tol{height:48px;border-radius:12px;border:1px solid #D1D5DB;background:var(--bg);font-size:16px;font-weight:700}
.tol.on{border:0;background:var(--ink);color:#fff}
.cards{display:flex;flex-direction:column;gap:6px}
.card{display:flex;align-items:center;gap:10px;min-height:62px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);text-align:left;width:100%}
.card.fail{background:#F9FAFB}
.card.fail .nm,.card.fail .ex{color:var(--ink3)}
.card.on{border:2px solid var(--accent);background:var(--accentSoft)}
.card .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card .nm{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .rd{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.card .ex{font-size:18px;font-weight:700}
.card .mt{font-size:13px;color:var(--ink3)}
.badge{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.badge.best{background:var(--accent);color:#fff}
.badge.ok{background:#DCFCE7;color:#166534}
.badge.over{background:#FEF3C7;color:#92400E}
.muted{font-size:13px;color:var(--ink3)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:44px;padding:0 14px;border-radius:999px;border:1px solid #D1D5DB;background:var(--bg);font-size:15px;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.err{padding:12px 14px;border-radius:12px;background:#FEF2F2;color:#991B1B;font-size:14px;line-height:1.5}

/* 검색 패널 */
#search{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;
  padding:calc(var(--safeT) + 10px) 12px 12px}
#search.show{display:flex}
#search .bar{display:flex;gap:8px;align-items:center}
#search input{flex:1;height:52px;border:2px solid var(--ink);border-radius:14px;padding:0 14px;font-size:17px;outline:none;background:var(--bg)}
#search .list{flex:1;overflow-y:auto;margin-top:10px;display:flex;flex-direction:column}
.res{display:flex;flex-direction:column;gap:2px;padding:12px 6px;border:0;border-bottom:1px solid var(--soft);background:none;text-align:left;min-height:56px}
.res b{font-size:16px}
.res small{font-size:13px;color:var(--ink3)}
.res.me b{color:var(--accent)}

/* 설정 */
#setup{position:absolute;inset:0;z-index:50;background:var(--bg);display:none;overflow-y:auto;
  padding:calc(var(--safeT) + 24px) 20px calc(24px + var(--safeB))}
#setup.show{display:block}
#setup .wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#setup label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
#setup input{height:50px;border:1px solid #D1D5DB;border-radius:12px;padding:0 12px;font-size:15px;font-family:ui-monospace,monospace}
#setup a{color:var(--accent)}

/* 네이버 넘기기 */
#send{position:absolute;inset:0;z-index:45;background:rgba(17,24,39,.5);display:none;align-items:flex-end}
#send.show{display:flex}
#send .box{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--safeB));display:flex;flex-direction:column;gap:14px;max-height:80dvh;overflow-y:auto}
.wp{display:flex;align-items:center;gap:12px;min-height:28px}
.wp small{width:48px;font-size:13px;color:var(--ink3);flex:none}
.wp b{font-size:15px;font-weight:600}
.wp i{flex:none;width:12px;height:12px;border-radius:50%}

#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safeB) + 24px);z-index:60;
  background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);
  display:none;text-align:center}
#toast.show{display:block}

/* 지도 마커 */
.mk{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.3)}
.mk.s{width:16px;height:16px;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.3)}
.mk.d{width:18px;height:18px;border-radius:4px}
.mk.w{width:14px;height:14px;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.me{width:16px;height:16px;border-radius:50%;background:#2563EB;box-shadow:0 0 0 4px rgba(37,99,235,.25),0 0 0 2px #fff inset}
</style>
</head>
<body>
<div id="app">
  <div id="map" aria-label="지도"></div>

  <div id="top">
    <div class="rows">
      <button class="place" id="startBtn"><i class="dot"></i><span class="t" id="startTxt">현재 위치</span></button>
      <div class="div"></div>
      <button class="place empty" id="destBtn"><i class="sq"></i><span class="t" id="destTxt">어디로 갈까요?</span></button>
    </div>
    <button class="iconbtn" id="setBtn" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <div id="hint"><i></i><span id="hintTxt"></span></div>

  <div id="fabs">
    <button class="fab on" id="trafficBtn" aria-label="실시간 교통 표시">교통</button>
    <button class="fab" id="locBtn" aria-label="내 위치로 이동">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    </button>
  </div>

  <div id="sheet">
    <button class="grab" id="grab" aria-label="시트 접기/펼치기"><i></i></button>
    <div class="body" id="sheetBody"></div>
  </div>

  <div id="search">
    <div class="bar">
      <button class="iconbtn" id="searchClose" aria-label="닫기">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <input id="q" type="search" placeholder="장소, 주소 검색" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="list" id="results"></div>
  </div>

  <div id="send"><div class="box" id="sendBox"></div></div>

  <div id="setup">
    <div class="wrap">
      <h2>처음 한 번만 설정하면 됩니다</h2>
      <p class="sub">이 앱은 서버 없이 폰에서 바로 지도(카카오맵)와 경로 계산(OpenRouteService)을 불러옵니다. 둘 다 무료 키가 필요해요. 키는 이 폰에만 저장됩니다.</p>
      <label>카카오 JavaScript 키
        <input id="kakaoKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: 1a2b3c...">
      </label>
      <p class="muted">developers.kakao.com → 앱 만들기 → 플랫폼 Web에 이 사이트 주소 등록 → 앱 키의 JavaScript 키. 콘솔에서 카카오맵 사용 설정도 켜주세요.</p>
      <label>OpenRouteService 키
        <input id="orsKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: 5b3ce3...">
      </label>
      <p class="muted">openrouteservice.org 가입 → Dashboard에서 무료(Standard) 토큰 발급.</p>
      <button class="btn primary" id="saveKeys">저장하고 시작</button>
      <button class="btn full" id="closeSetup" style="display:none">닫기</button>
    </div>
  </div>

  <div id="toast" role="status"></div>
</div>

<script>
(function () {
'use strict';

/* ---------- 저장소 ---------- */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem('detour.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('detour.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- 상태 ---------- */
var S = {
  start: null,            // {lat,lng,name,isMe}
  dest: null,
  me: null,
  mode: 'needDest',       // needDest | loading | pickA | pickB | computing | result | error
  pendingA: null,
  segs: [],               // {a,b,coords,boxes}
  base: null,             // {coords,dist,dur,roads}
  cands: [],
  sel: null,              // 후보 id
  tol: LS.get('tol', 10),
  err: '',
  traffic: true,
  editing: 'dest'
};

var map, places, $ = function (id) { return document.getElementById(id); };
var ov = { base: [], segs: [], cands: [], marks: [], pending: null, me: null };

/* ---------- 유틸 ---------- */
function toast(msg, ms) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, ms || 2800);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function hav(a, b) { // [lng,lat]
  var R = 6371000, r = Math.PI / 180;
  var dLat = (b[1] - a[1]) * r, dLng = (b[0] - a[0]) * r;
  var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function fmtDur(sec) {
  var m = Math.round(sec / 60), h = Math.floor(m / 60); m = m % 60;
  return h ? h + '시간 ' + m + '분' : m + '분';
}
function fmtKm(m) { return (m / 1000 >= 10 ? Math.round(m / 1000) : (m / 1000).toFixed(1)) + 'km'; }
function LL(p) { return new kakao.maps.LatLng(p[1], p[0]); }
function pt(o) { return [o.lng, o.lat]; }

/* ---------- 경로 API (OpenRouteService) ---------- */
function ors(coords, extra) {
  var body = { coordinates: coords, radiuses: coords.map(function () { return -1; }), instructions: true, preference: 'fastest', units: 'm', language: 'en' };
  if (extra) for (var k in extra) body[k] = extra[k];
  return fetch('https://api.openrouteservice.org/v2/directions/driving-car/geojson', {
    method: 'POST',
    headers: { 'Authorization': LS.get('orsKey', ''), 'Content-Type': 'application/json', 'Accept': 'application/geo+json, application/json' },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) {
        var m = (j && j.error && (j.error.message || j.error)) || ('HTTP ' + r.status);
        if (r.status === 401 || r.status === 403) m = '경로 계산 키(OpenRouteService)가 올바르지 않아요';
        if (r.status === 429) m = '경로 계산 호출 한도를 넘었어요. 잠시 후 다시 시도하세요';
        var e = new Error(typeof m === 'string' ? m : JSON.stringify(m)); e.status = r.status; throw e;
      }
      return (j.features || []).map(function (f) {
        var p = f.properties || {}, sm = p.summary || {};
        return { coords: f.geometry.coordinates, dist: sm.distance || 0, dur: sm.duration || 0, roads: mainRoads(p) };
      });
    });
  });
}

function mainRoads(p) {
  var acc = {};
  (p.segments || []).forEach(function (sg) {
    (sg.steps || []).forEach(function (st) {
      var n = (st.name || '').trim();
      if (!n || n === '-') return;
      n = n.split(',')[0].trim();
      acc[n] = (acc[n] || 0) + (st.distance || 0);
    });
  });
  return Object.keys(acc).sort(function (a, b) { return acc[b] - acc[a]; }).slice(0, 3)
    .filter(function (n) { return acc[n] > 3000; });
}

/* 정체 구간 → 작은 차단 박스들 (고속도로 본선만 끊고 주변 국도는 최대한 살림) */
function boxesAlong(coords) {
  var total = 0, cum = [0];
  for (var i = 1; i < coords.length; i++) { total += hav(coords[i - 1], coords[i]); cum.push(total); }
  var margin = Math.min(400, total * 0.2), step = 900, targets = [];
  if (total - 2 * margin < step) targets.push(total / 2);
  else for (var d = margin; d <= total - margin; d += step) targets.push(d);
  var boxes = [], j = 1;
  targets.forEach(function (t) {
    while (j < cum.length - 1 && cum[j] < t) j++;
    var a = coords[j - 1], b = coords[j], seg = cum[j] - cum[j - 1] || 1, f = (t - cum[j - 1]) / seg;
    var lng = a[0] + (b[0] - a[0]) * f, lat = a[1] + (b[1] - a[1]) * f;
    var h = 70, dLat = h / 111320, dLng = h / (111320 * Math.cos(lat * Math.PI / 180));
    boxes.push([[[lng - dLng, lat - dLat], [lng + dLng, lat - dLat], [lng + dLng, lat + dLat], [lng - dLng, lat + dLat], [lng - dLng, lat - dLat]]]);
  });
  return { boxes: boxes, length: total };
}

/* 우회 경로가 기준 경로에서 벗어난 구간에서 네이버에 넘길 경유지 고르기 */
function pickWaypoints(cand, base) {
  var lat0 = base[0][1], lng0 = base[0][0], kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110540;
  function P(c) { return [(c[0] - lng0) * kx, (c[1] - lat0) * ky]; }
  function thin(cs, gap) { var out = [cs[0]], last = cs[0]; for (var i = 1; i < cs.length; i++) { if (hav(last, cs[i]) >= gap) { out.push(cs[i]); last = cs[i]; } } out.push(cs[cs.length - 1]); return out; }
  var B = thin(base, 150).map(P), C = thin(cand, 100);
  function dSeg(p, a, b) {
    var vx = b[0] - a[0], vy = b[1] - a[1], wx = p[0] - a[0], wy = p[1] - a[1], L = vx * vx + vy * vy;
    var t = L ? Math.max(0, Math.min(1, (wx * vx + wy * vy) / L)) : 0;
    var dx = wx - t * vx, dy = wy - t * vy; return Math.sqrt(dx * dx + dy * dy);
  }
  var runs = [], cur = null, cum = 0;
  for (var i = 0; i < C.length; i++) {
    if (i) cum += hav(C[i - 1], C[i]);
    var p = P(C[i]), best = 1e12;
    for (var k = 1; k < B.length; k++) { var d = dSeg(p, B[k - 1], B[k]); if (d < best) best = d; if (best < 50) break; }
    if (best > 350) { if (!cur) { cur = { pts: [], from: cum }; runs.push(cur); } cur.pts.push({ c: C[i], at: cum }); cur.to = cum; }
    else cur = null;
  }
  runs = runs.filter(function (r) { return r.to - r.from >= 800; });
  var wps = [];
  runs.forEach(function (r) {
    var len = r.to - r.from, fr = len < 3000 ? [0.5] : [0.33, 0.72];
    fr.forEach(function (f) {
      var t = r.from + len * f, bestP = r.pts[0];
      r.pts.forEach(function (q) { if (Math.abs(q.at - t) < Math.abs(bestP.at - t)) bestP = q; });
      wps.push(bestP.c);
    });
  });
  if (wps.length > 5) { var out = []; for (var n = 0; n < 5; n++) out.push(wps[Math.round(n * (wps.length - 1) / 4)]); wps = out; }
  return wps;
}

/* ---------- 계산 흐름 ---------- */
function loadBase() {
  if (!S.start || !S.dest) { S.mode = 'needDest'; render(); return; }
  S.mode = 'loading'; S.base = null; S.cands = []; S.segs = []; S.pendingA = null; S.err = '';
  render();
  ors([pt(S.start), pt(S.dest)]).then(function (r) {
    if (!r.length) throw new Error('경로를 찾지 못했어요');
    S.base = r[0]; S.mode = 'pickA'; render(); fitTo(S.base.coords);
  }).catch(fail);
}

function addSegment(a, b) {
  S.mode = 'computing'; render();
  var straight = hav(a, b);
  ors([a, b]).then(function (r) {
    var path = r[0];
    if (path.dist > straight * 2.5 + 2000) {
      return ors([b, a]).then(function (r2) {
        if (r2[0].dist < path.dist) { toast('A→B를 진행 방향 순서로 탭하면 더 정확해요'); return r2[0]; }
        return path;
      });
    }
    return path;
  }).then(function (path) {
    var bx = boxesAlong(path.coords);
    S.segs.push({ a: a, b: b, coords: path.coords, boxes: bx.boxes, length: bx.length });
    return computeCands().catch(function (e) { S.segs.pop(); throw e; });
  }).catch(fail);
}

function computeCands() {
  S.mode = 'computing'; render();
  var polys = []; S.segs.forEach(function (s) { polys = polys.concat(s.boxes); });
  var avoid = { type: 'MultiPolygon', coordinates: polys };
  var se = [pt(S.start), pt(S.dest)];
  var p1 = ors(se, { options: { avoid_polygons: avoid }, alternative_routes: { target_count: 3, weight_factor: 1.6, share_factor: 0.6 } })
    .catch(function (e) { if (e.status === 401 || e.status === 403 || e.status === 429) throw e; return ors(se, { options: { avoid_polygons: avoid } }); });
  var p2 = ors(se, { options: { avoid_polygons: avoid, avoid_features: ['highways'] } }).catch(function () { return []; });
  return Promise.all([p1, p2]).then(function (res) {
    var list = res[0].concat(res[1].map(function (c) { c.noHwy = true; return c; }));
    var uniq = [];
    list.forEach(function (c) {
      var dup = uniq.some(function (u) { return Math.abs(u.dist - c.dist) < Math.max(300, u.dist * 0.01) && Math.abs(u.dur - c.dur) < 90; });
      if (!dup) uniq.push(c);
    });
    if (!uniq.length) throw new Error('회피 조건을 지키는 경로를 찾지 못했어요');
    uniq.forEach(function (c, i) {
      c.id = 'c' + i;
      c.extra = Math.round((c.dur - S.base.dur) / 60);
      c.wps = pickWaypoints(c.coords, S.base.coords);
    });
    S.cands = uniq; S.sel = null; S.mode = 'result';
    render(); fitTo(S.base.coords.concat(uniq[0].coords));
  });
}

function ranked() {
  var c = S.cands.slice().sort(function (x, y) {
    if (Math.abs(x.dur - y.dur) <= 180) return x.dist - y.dist;
    return x.dur - y.dur;
  });
  var pass = c.filter(function (x) { return x.extra <= S.tol; });
  return { all: c, pass: pass, best: pass[0] ? pass[0].id : null };
}
function selected() {
  var r = ranked(), id = S.sel || r.best || (r.all[0] && r.all[0].id);
  return r.all.filter(function (c) { return c.id === id; })[0] || null;
}

function fail(e) {
  console.error(e);
  S.err = (e && e.message) || '알 수 없는 오류';
  if (/Failed to fetch|NetworkError|Load failed/i.test(S.err)) S.err = '인터넷 연결을 확인해 주세요';
  S.mode = S.base ? (S.cands.length ? 'result' : 'pickA') : 'error';
  S.pendingA = null;
  render(); toast(S.err, 4000);
}

/* ---------- 지도 그리기 ---------- */
function clear(arr) { arr.forEach(function (o) { o.setMap(null); }); arr.length = 0; }
function line(coords, o) {
  var pl = new kakao.maps.Polyline({ map: map, path: coords.map(LL), strokeWeight: o.w, strokeColor: o.c, strokeOpacity: o.op == null ? 1 : o.op, strokeStyle: o.st || 'solid' });
  return pl;
}
function mark(p, html, z) {
  var el = document.createElement('div'); el.innerHTML = html;
  return new kakao.maps.CustomOverlay({ map: map, position: LL(p), content: el.firstChild, xAnchor: 0.5, yAnchor: 0.5, zIndex: z || 3 });
}
function fitTo(coords) {
  var b = new kakao.maps.LatLngBounds(); coords.forEach(function (c) { b.extend(LL(c)); });
  var sh = $('sheet').offsetHeight;
  map.setBounds(b, 130, 40, Math.min(sh + 20, window.innerHeight * 0.6), 40);
}

var lastTap = 0;
function tapHandler(me) { var now = Date.now(); if (now - lastTap < 350) return; lastTap = now; onTap([me.latLng.getLng(), me.latLng.getLat()]); }

function draw() {
  clear(ov.base); clear(ov.segs); clear(ov.cands); clear(ov.marks);
  if (ov.pending) { ov.pending.setMap(null); ov.pending = null; }
  var showCands = S.mode === 'result';
  if (S.base) {
    ov.base.push(line(S.base.coords, { w: 10, c: '#FFFFFF', op: 0.9 }));
    var bl = line(S.base.coords, { w: 5, c: '#6B7280', op: showCands ? 0.55 : 0.85 });
    kakao.maps.event.addListener(bl, 'click', tapHandler);
    ov.base.push(bl);
  }
  if (showCands) {
    var sel = selected();
    S.cands.forEach(function (c) {
      if (sel && c.id === sel.id) return;
      var l = line(c.coords, { w: 6, c: '#93C5FD', op: 0.95 });
      kakao.maps.event.addListener(l, 'click', function () { S.sel = c.id; render(); });
      ov.cands.push(l);
    });
    if (sel) {
      ov.cands.push(line(sel.coords, { w: 13, c: '#FFFFFF', op: 1 }));
      ov.cands.push(line(sel.coords, { w: 8, c: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#1D4ED8', op: 1 }));
      sel.wps.forEach(function (w) { ov.marks.push(mark(w, '<div class="mk w"></div>', 6)); });
    }
  }
  S.segs.forEach(function (s, i) {
    var a = line(s.coords, { w: 16, c: '#111827', op: 0.35 });
    var b = line(s.coords, { w: 3, c: '#FFFFFF', op: 1, st: 'shortdash' });
    kakao.maps.event.addListener(a, 'click', tapHandler);
    ov.segs.push(a, b);
    var n = S.segs.length > 1 ? (i + 1) : '';
    ov.marks.push(mark(s.a, '<div class="mk">A' + n + '</div>', 8));
    ov.marks.push(mark(s.b, '<div class="mk">B' + n + '</div>', 8));
  });
  if (S.pendingA) ov.pending = mark(S.pendingA, '<div class="mk">A</div>', 9);
  if (S.start && !S.start.isMe) ov.marks.push(mark(pt(S.start), '<div class="mk s"></div>', 7));
  if (S.dest) ov.marks.push(mark(pt(S.dest), '<div class="mk d"></div>', 7));
}

/* ---------- 탭 처리 ---------- */
function onTap(p) {
  if (S.mode === 'pickA') { S.pendingA = p; S.mode = 'pickB'; render(); return; }
  if (S.mode === 'pickB') {
    if (hav(S.pendingA, p) < 300) { toast('A와 너무 가까워요. 정체가 끝나는 지점을 탭하세요'); return; }
    var a = S.pendingA; S.pendingA = null; addSegment(a, p); return;
  }
}

/* ---------- 화면 (하단 시트) ---------- */
function render() {
  $('startTxt').textContent = S.start ? S.start.name : '현재 위치 찾는 중…';
  $('destTxt').textContent = S.dest ? S.dest.name : '어디로 갈까요?';
  $('destBtn').classList.toggle('empty', !S.dest);

  var hint = { pickA: '정체가 시작되는 곳을 탭하세요', pickB: '정체가 끝나는 곳을 탭하세요' }[S.mode];
  $('hint').classList.toggle('show', !!hint); $('hintTxt').textContent = hint || '';

  var h = '';
  if (S.mode === 'needDest') {
    var rec = LS.get('recent', []);
    h += '<h2>어디로 갈까요?</h2>';
    h += '<button class="btn primary" data-act="search">목적지 검색</button>';
    if (rec.length) {
      h += '<span class="muted">최근 목적지</span><div class="chips">';

    }

  } else if (S.mode === 'error') {
    h += '<div class="err">' + esc(S.err) + '</div><button class="btn full" data-act="retry">다시 시도</button>';
  } else if (S.mode === 'pickA' || S.mode === 'pickB') {
    var n = S.segs.length;
    h += '<h2>' + (n ? '정체 구간을 하나 더 찍으세요' : '정체 구간을 지도에서 탭하세요') + '</h2>';
    h += '<p class="sub">빨간색·주황색 도로가 시작되는 곳과 끝나는 곳을 진행 방향 순서로 누르세요.</p>';
    h += '<div class="pills"><div class="pill ' + (S.mode === 'pickA' ? 'active' : 'filled') + '"><small>A · 정체 시작</small><b>' + (S.pendingA ? '찍음' : '탭하세요') + '</b></div>' +
      '<div class="pill ' + (S.mode === 'pickB' ? 'active' : '') + '"><small>B · 정체 끝</small><b>탭하세요</b></div></div>';
    h += '<div class="legend"><span><i style="background:var(--green)"></i>원활</span><span><i style="background:var(--orange)"></i>서행</span><span><i style="background:var(--red)"></i>정체</span><span><i style="background:#6B7280"></i>현재 경로</span></div>';
    if (S.base) h += '<div class="info"><small>현재 경로 (정체 없을 때 기준)</small><b>' + fmtDur(S.base.dur) + ' · ' + fmtKm(S.base.dist) + '</b>' +
      (S.base.roads.length ? '<small>' + esc(S.base.roads.join(' · ')) + '</small>' : '') + '</div>';
    if (S.err) h += '<div class="err">' + esc(S.err) + '</div>';
    if (S.mode === 'pickB') h += '<button class="btn full" data-act="undoA">A 다시 찍기</button>';
    else if (n) h += '<button class="btn full" data-act="backResult">취소하고 결과 보기</button>';
  } else if (S.mode === 'result') {
    var r = ranked(), sel = selected();
    h += '<div class="row"><div class="grow"><span class="muted">회피 구간</span><br><b style="font-size:17px">' +
      S.segs.length + '곳 · 총 ' + fmtKm(S.segs.reduce(function (a, s) { return a + s.length; }, 0)) + '</b></div>' +
      '<button class="btn" data-act="add">구간 추가</button><button class="btn" data-act="reset">다시 찍기</button></div>';
    h += '<span class="muted">평소보다 최대 몇 분 더 걸려도 괜찮나요?</span><div class="tols">';
    [5, 10, 15, 20].forEach(function (t) { h += '<button class="tol' + (S.tol === t ? ' on' : '') + '" data-act="tol" data-t="' + t + '">+' + t + '분</button>'; });
    h += '</div><div class="cards">';
    r.all.forEach(function (c) {
      var pass = c.extra <= S.tol, on = sel && sel.id === c.id;
      var badge = pass ? (c.id === r.best ? '<span class="badge best">추천</span>' : '<span class="badge ok">허용 범위</span>') : '<span class="badge over">+' + S.tol + '분 초과</span>';
      var title = c.noHwy ? '고속도로 없이' : (c.roads[0] ? esc(c.roads[0]) + ' 경유' : '우회 경로');
      h += '<button class="card' + (pass ? '' : ' fail') + (on ? ' on' : '') + '" data-act="pick" data-id="' + c.id + '">' +
        '<span class="l"><span class="nm">' + title + ' ' + badge + '</span><span class="rd">' + esc(c.roads.join(' · ') || '주요 도로 정보 없음') + '</span></span>' +
        '<span class="r"><span class="ex">' + (c.extra >= 0 ? '+' : '') + c.extra + '분</span><span class="mt">' + fmtDur(c.dur) + ' · ' + fmtKm(c.dist) + '</span></span></button>';
    });
    h += '</div>';
    if (!r.pass.length) h += '<span class="muted">허용 범위 안의 경로가 없어요. 가장 나은 경로를 고르거나 허용 시간을 늘려보세요.</span>';
    h += '<span class="muted">시간은 정체가 없을 때 기준이라 실제 정체 구간을 지날 때보다 보수적으로 잡힙니다.</span>';
    if (sel) h += '<button class="btn primary" data-act="send"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"></path></svg><span>네이버 지도로 안내 시작<small>' +
      (sel.extra >= 0 ? '평소보다 +' : '평소보다 ') + sel.extra + '분 · 경유지 ' + sel.wps.length + '곳</small></span></button>';
  }
  $('sheetBody').innerHTML = h;
  if (map) draw();
}

/* ---------- 네이버 지도로 넘기기 ---------- */
function openSend() {
  var sel = selected(); if (!sel) return;
  var url = 'nmap://route/car?slat=' + S.start.lat + '&slng=' + S.start.lng + '&sname=' + encodeURIComponent(S.start.name);
  sel.wps.forEach(function (w, i) {
    var k = i + 1; url += '&v' + k + 'lat=' + w[1].toFixed(6) + '&v' + k + 'lng=' + w[0].toFixed(6) + '&v' + k + 'name=' + encodeURIComponent('우회 경유 ' + k);
  });
  url += '&dlat=' + S.dest.lat + '&dlng=' + S.dest.lng + '&dname=' + encodeURIComponent(S.dest.name) + '&appname=' + encodeURIComponent(location.origin + location.pathname);
  var h = '<h2>네이버 지도로 넘길 경로</h2><p class="sub">경유지를 넣어서 네이버 지도가 정체 구간으로 다시 끌고 가지 않게 합니다. 경유지는 우회로가 원래 길에서 갈라지는 구간에 자동으로 놓였어요.</p>';
  h += '<div class="wp"><i style="background:#111827"></i><small>출발</small><b>' + esc(S.start.name) + '</b></div>';
  sel.wps.forEach(function (w, i) { h += '<div class="wp"><i style="border:3px solid var(--accent);background:#fff"></i><small>경유 ' + (i + 1) + '</small><b>' + w[1].toFixed(4) + ', ' + w[0].toFixed(4) + '</b></div>'; });
  h += '<div class="wp"><i style="background:#111827;border-radius:3px"></i><small>도착</small><b>' + esc(S.dest.name) + '</b></div>';
  if (!sel.wps.length) h += '<p class="muted">이 경로는 원래 경로와 거의 같아서 경유지가 필요 없어요.</p>';
  h += '<a class="btn primary" style="text-decoration:none" href="' + esc(url) + '">네이버 지도 열기</a>';
  h += '<button class="btn full" data-act="closeSend">취소</button>';
  h += '<p class="muted">네이버 지도 앱이 설치된 폰에서 열립니다.</p>';
  $('sendBox').innerHTML = h; $('send').classList.add('show');
}

/* ---------- 검색 ---------- */
function openSearch(which) {
  S.editing = which; $('q').value = ''; $('search').classList.add('show');
  renderResults([]); setTimeout(function () { $('q').focus(); }, 50);
}
function renderResults(list) {
  var h = '';
  if (S.editing === 'start') h += '<button class="res me" data-act="useMe"><b>현재 위치</b><small>GPS로 지금 있는 곳에서 출발</small></button>';
  if (!list.length && !$('q').value) {
    LS.get('recent', []).forEach(function (r, i) { h += '<button class="res" data-act="pickRecent" data-i="' + i + '"><b>' + esc(r.name) + '</b><small>' + esc(r.addr || '최근 목적지') + '</small></button>'; });
  }
  list.forEach(function (r, i) { h += '<button class="res" data-act="pickRes" data-i="' + i + '"><b>' + esc(r.place_name) + '</b><small>' + esc(r.road_address_name || r.address_name) + '</small></button>'; });
  $('results').innerHTML = h; renderResults.list = list;
}
var qTimer;
function doSearch() {
  var q = $('q').value.trim(); if (!q) { renderResults([]); return; }
  var opt = { size: 15 };
  if (S.me) { opt.location = new kakao.maps.LatLng(S.me.lat, S.me.lng); }
  places.keywordSearch(q, function (data, status) {
    if (status === kakao.maps.services.Status.OK) renderResults(data);
    else if (status === kakao.maps.services.Status.ZERO_RESULT) { renderResults([]); $('results').insertAdjacentHTML('beforeend', '<p class="muted" style="padding:12px 6px">검색 결과가 없어요</p>'); }
    else toast('검색에 실패했어요');
  }, opt);
}
function choosePlace(p) {
  $('search').classList.remove('show');
  if (S.editing === 'start') S.start = p;
  else {
    S.dest = p;
    var rec = LS.get('recent', []).filter(function (r) { return r.name !== p.name; });
    rec.unshift({ name: p.name, lat: p.lat, lng: p.lng, addr: p.addr || '' }); LS.set('recent', rec.slice(0, 6));
  }
  if (!S.start) { toast('현재 위치를 찾는 중이에요. 출발지를 직접 골라도 됩니다'); render(); return; }
  loadBase();
}

/* ---------- 위치 ---------- */
function locate(move) {
  if (!navigator.geolocation) { toast('이 브라우저는 위치를 지원하지 않아요'); return; }
  navigator.geolocation.getCurrentPosition(function (pos) {
    S.me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    if (!S.start || S.start.isMe) S.start = { lat: S.me.lat, lng: S.me.lng, name: '현재 위치', isMe: true };
    if (ov.me) ov.me.setMap(null);
    ov.me = mark([S.me.lng, S.me.lat], '<div class="me"></div>', 10);
    if (move || !S.base) map.setCenter(new kakao.maps.LatLng(S.me.lat, S.me.lng));
    if (S.dest && !S.base && S.mode !== 'loading') loadBase(); else render();
  }, function () {
    toast('위치 권한이 없어요. 출발지를 직접 검색해 주세요', 3500);
    if (S.start && S.start.isMe) S.start = null;
    render();
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act');
  if (a === 'search') openSearch('dest');
  else if (a === 'recent') { var r = LS.get('recent', [])[+b.dataset.i]; S.editing = 'dest'; choosePlace({ name: r.name, lat: r.lat, lng: r.lng, addr: r.addr }); }
  else if (a === 'retry') loadBase();
  else if (a === 'undoA') { S.pendingA = null; S.mode = 'pickA'; render(); }
  else if (a === 'backResult') { S.pendingA = null; S.mode = 'result'; render(); }
  else if (a === 'add') { S.mode = 'pickA'; S.err = ''; render(); toast('추가로 피할 정체 구간의 시작점을 탭하세요'); }
  else if (a === 'reset') { S.segs = []; S.cands = []; S.sel = null; S.mode = 'pickA'; S.err = ''; render(); if (S.base) fitTo(S.base.coords); }
  else if (a === 'tol') { S.tol = +b.dataset.t; S.sel = null; LS.set('tol', S.tol); render(); }
  else if (a === 'pick') { S.sel = b.dataset.id; render(); }
  else if (a === 'send') openSend();
  else if (a === 'closeSend') $('send').classList.remove('show');
  else if (a === 'useMe') { $('search').classList.remove('show'); S.start = null; S.base = null; S.cands = []; S.segs = []; render(); locate(true); }
  else if (a === 'pickRes') { var x = renderResults.list[+b.dataset.i]; choosePlace({ name: x.place_name, lat: +x.y, lng: +x.x, addr: x.road_address_name || x.address_name }); }
  else if (a === 'pickRecent') { var y = LS.get('recent', [])[+b.dataset.i]; choosePlace({ name: y.name, lat: y.lat, lng: y.lng, addr: y.addr }); }
});
$('destBtn').onclick = function () { openSearch('dest'); };
$('startBtn').onclick = function () { openSearch('start'); };
$('searchClose').onclick = function () { $('search').classList.remove('show'); };
$('q').addEventListener('input', function () { clearTimeout(qTimer); qTimer = setTimeout(doSearch, 300); });
$('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { clearTimeout(qTimer); doSearch(); } });
$('grab').onclick = function () { $('sheet').classList.toggle('collapsed'); };
$('send').addEventListener('click', function (e) { if (e.target === $('send')) $('send').classList.remove('show'); });
$('trafficBtn').onclick = function () {
  S.traffic = !S.traffic; this.classList.toggle('on', S.traffic);
  if (S.traffic) map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC); else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
};
$('locBtn').onclick = function () { locate(true); };
$('setBtn').onclick = function () { showSetup(true); };

/* ---------- 설정 / 시작 ---------- */
function showSetup(closable) {
  $('kakaoKey').value = LS.get('kakaoKey', ''); $('orsKey').value = LS.get('orsKey', '');
  $('closeSetup').style.display = closable ? 'block' : 'none';
  $('setup').classList.add('show');
}
$('closeSetup').onclick = function () { $('setup').classList.remove('show'); };
$('saveKeys').onclick = function () {
  var k = $('kakaoKey').value.trim(), o = $('orsKey').value.trim();
  if (!k || !o) { toast('두 키를 모두 입력해 주세요'); return; }
  var changedKakao = k !== LS.get('kakaoKey', '');
  LS.set('kakaoKey', k); LS.set('orsKey', o);
  $('setup').classList.remove('show');
  if (changedKakao || !map) location.reload();
};

function loadKakao(key) {
  return new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(key) + '&libraries=services&autoload=false';
    s.onload = function () { if (window.kakao && kakao.maps) kakao.maps.load(res); else rej(new Error('sdk')); };
    s.onerror = function () { rej(new Error('sdk')); };
    document.head.appendChild(s);
  });
}

function boot() {
  render();
  if (!LS.get('kakaoKey', '') || !LS.get('orsKey', '')) { showSetup(false); return; }
  loadKakao(LS.get('kakaoKey', '')).then(function () {
    map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.5665, 126.978), level: 8 });
    map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
    places = new kakao.maps.services.Places();
    kakao.maps.event.addListener(map, 'click', tapHandler);
    render(); locate(false);
  }).catch(function () {
    S.mode = 'error';
    S.err = '지도를 불러오지 못했어요. 인터넷 연결, 카카오 JavaScript 키, 카카오 콘솔에 이 사이트 주소(' + location.origin + ')가 등록됐는지 확인해 주세요.';
    render(); showSetup(true);
  });
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
boot();
})();
</script>
